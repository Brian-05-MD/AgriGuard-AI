<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriGuard AI - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

</head>

<body>

    <div class="login-container">

        <h1>AgriGuard AI</h1>

        <p>
            Intelligent Agricultural Decision-Support System
        </p>

        <h2>Farmer Login</h2>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <p>{{ message }}</p>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="/register">
                Create Farmer Account
            </a>
        </p>

    </div>

</body>

</html>
