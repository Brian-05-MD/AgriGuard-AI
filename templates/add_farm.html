<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriGuard AI - Add Farm</title>

</head>

<body>

    <h1>AgriGuard AI</h1>

    <h2>Add New Farm</h2>

    <form method="POST">

        <label>Farm Name</label>

        <br>

        <input
            type="text"
            name="farm_name"
            placeholder="Example: Family Farm"
            required
        >

        <br><br>

        <label>Location</label>

        <br>

        <input
            type="text"
            name="location"
            placeholder="Example: Lusaka"
            required
        >

        <br><br>

        <label>Farm Size (hectares)</label>

        <br>

        <input
            type="number"
            name="farm_size"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <button type="submit">
            Add Farm
        </button>

    </form>

    <br>

    <a href="/farms">
        ← Back to My Farms
    </a>

</body>

</html>
