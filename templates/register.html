<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriGuard AI - Register</title>

</head>

<body>

    <h1>AgriGuard AI</h1>

    <p>
        Intelligent Agricultural Decision-Support System
    </p>

    <h2>Create Farmer Account</h2>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <p>{{ message }}</p>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <label>Full Name</label>

        <br>

        <input
            type="text"
            name="full_name"
            required
        >

        <br><br>

        <label>Email</label>

        <br>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <label>Password</label>

        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?

        <a href="/login">
            Login
        </a>
    </p>

</body>

</html>
